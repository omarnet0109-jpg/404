name: Validate 404 production
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run offline tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s backend/tests -v
      - name: Validate PWA and bundled workflow
        run: |
          node --check mobile-studio/app.js
          node --check mobile-studio/quick-preview.js
          node --check mobile-studio/sw.js
          python -m json.tool mobile-studio/manifest.webmanifest > /dev/null
          python -m json.tool backend/workflows/wan22_ti2v_5b_api.json > /dev/null
      - name: Validate episode 1 exact timing, speaker locks and references
        run: python production/check_episode.py
      - name: Validate approved scene files
        run: python studio.py validate-scenes
      - name: Validate template and build example manifest
        run: |
          python studio.py validate templates/scene.json
          python studio.py plan templates/scene.json
